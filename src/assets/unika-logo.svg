<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Main Gradient Purple -->
    <linearGradient id="unikaGradMain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9333ea" />
      <stop offset="50%" stop-color="#7e22ce" />
      <stop offset="100%" stop-color="#581c87" />
    </linearGradient>

    <!-- Accent Bright Purple -->
    <linearGradient id="unikaGradAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="60%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#7e22ce" />
    </linearGradient>

    <!-- Subtle Glow Shadow -->
    <filter id="unikaGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#7e22ce" flood-opacity="0.25" />
    </filter>
  </defs>

  <g filter="url(#unikaGlow)">
    <!-- Graduation Cap Top Diamond -->
    <polygon points="250,55 425,145 250,235 75,145" fill="url(#unikaGradMain)" />
    
    <!-- Under Cap Shadow Layer -->
    <polygon points="250,85 390,145 250,205 110,145" fill="url(#unikaGradAccent)" opacity="0.35" />

    <!-- Tassel String & Tassel Drop -->
    <path d="M 405,150 C 418,190 415,220 412,235" stroke="url(#unikaGradMain)" stroke-width="8" stroke-linecap="round" fill="none" />
    <circle cx="412" cy="242" r="9" fill="url(#unikaGradMain)" />
    <polygon points="405,250 419,250 422,305 402,305" fill="url(#unikaGradMain)" />

    <!-- U Shape - Main Body -->
    <path d="M 135,210 
             L 192,238 
             L 192,315 
             C 192,385 308,385 308,315 
             L 308,238 
             L 365,210 
             L 365,315 
             C 365,435 135,435 135,315 Z" 
          fill="url(#unikaGradMain)" />

    <!-- U Shape - 3D Curved Ribbon Overlay -->
    <path d="M 135,210 
             C 135,345 235,430 275,415 
             C 210,415 192,345 192,238 Z" 
          fill="url(#unikaGradAccent)" />
  </g>
</svg>
